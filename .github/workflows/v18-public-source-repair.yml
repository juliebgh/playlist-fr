name: V18 reparation sources IPTV publiques

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Chercher des remplacements publics et tester avant application
        run: |
          python3 <<'PY'
          from pathlib import Path
          import csv, re, subprocess, urllib.request, unicodedata

          PLAYLIST=Path('playlist.m3u')
          HEALTH=Path('health-report.csv')
          UA={'User-Agent':'Mozilla/5.0 playlist-fr-health-repair'}
          SOURCES=[
            'https://iptv-org.github.io/iptv/countries/fr.m3u',
            'https://iptv-org.github.io/iptv/countries/ch.m3u',
            'https://iptv-org.github.io/iptv/languages/fra.m3u',
          ]

          def norm(s):
              s=unicodedata.normalize('NFKD',s or '')
              s=''.join(c for c in s if not unicodedata.combining(c)).lower()
              s=re.sub(r'\([^)]*\)|\[[^]]*\]',' ',s)
              s=re.sub(r'\b(1080p|720p|576p|480p|hd|fhd|uhd|4k)\b',' ',s)
              s=re.sub(r'[^a-z0-9]+',' ',s)
              return re.sub(r'\s+',' ',s).strip()

          def download(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read().decode('utf-8','ignore')

          def parse(text):
              out=[]; ext=None
              for raw in text.splitlines():
                  line=raw.strip()
                  if line.startswith('#EXTINF:'): ext=line; continue
                  if ext and (line.startswith('http://') or line.startswith('https://')):
                      name=ext.split(',',1)[1].strip() if ',' in ext else ''
                      attrs=dict(re.findall(r'([\w-]+)="([^"]*)"',ext))
                      out.append({'name':name,'url':line,'tvg_id':attrs.get('tvg-id','')})
                      ext=None
              return out

          def test(url):
              cmd=['ffprobe','-v','error','-rw_timeout','10000000','-show_entries','stream=codec_type,width,height','-of','csv=p=0',url]
              try:
                  p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=15)
                  return p.returncode==0 and bool(p.stdout.strip()), p.stdout.strip()[:200]
              except Exception as e:
                  return False,str(e)[:200]

          candidates=[]
          for src in SOURCES:
              try: candidates += parse(download(src))
              except Exception as e: print('WARN source',src,e)

          by_id={}
          by_name={}
          for c in candidates:
              if c['tvg_id']: by_id.setdefault(c['tvg_id'],[]).append(c)
              by_name.setdefault(norm(c['name']),[]).append(c)

          broken=[]
          if HEALTH.exists():
              with HEALTH.open(newline='',encoding='utf-8') as f:
                  for r in csv.DictReader(f):
                      if (r.get('status') or '').upper() != 'OK': broken.append(r)

          lines=PLAYLIST.read_text(encoding='utf-8',errors='ignore').splitlines()
          report=[]; applied=0
          for r in broken:
              target_name=r.get('name',''); target_url=r.get('url','')
              # Localiser l'EXTINF actuel par URL afin de conserver exactement ses metadonnees.
              try: ui=lines.index(target_url)
              except ValueError: continue
              ei=ui-1
              while ei>=0 and not lines[ei].startswith('#EXTINF:'): ei-=1
              if ei<0: continue
              attrs=dict(re.findall(r'([\w-]+)="([^"]*)"',lines[ei]))
              tid=attrs.get('tvg-id','')
              pool=[]
              if tid: pool += by_id.get(tid,[])
              pool += by_name.get(norm(target_name),[])
              seen=set(); unique=[]
              for c in pool:
                  if c['url'] not in seen and c['url'] != target_url:
                      seen.add(c['url']); unique.append(c)
              replacement=None
              for c in unique[:6]:
                  ok,info=test(c['url'])
                  report.append(f"TEST | {target_name} | {c['url']} | {'OK' if ok else 'FAIL'} | {info}")
                  if ok:
                      replacement=c; break
              if replacement:
                  lines[ui]=replacement['url']; applied+=1
                  report.append(f"APPLIED | {target_name} | {target_url} -> {replacement['url']}")
              else:
                  report.append(f"NO_REPLACEMENT | {target_name}")

          PLAYLIST.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('public-repair-report.txt').write_text('\n'.join(report)+'\n',encoding='utf-8')
          print('REMPLACEMENTS_APPLIQUES',applied)
          PY

      - name: Commit uniquement si changement
        run: |
          git config user.name "playlist-fr-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u public-repair-report.txt
          git diff --cached --quiet || git commit -m "V18 remplace les flux HS par sources publiques testees"
          git pull --rebase origin main
          git push origin main
